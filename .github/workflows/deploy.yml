name: CI / Deploy

# Run tests on every push and PR; deploy to the VPS only when main passes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Dummy Square credentials satisfy the required Settings fields for both the import
      # sanity-check and the real pytest suite under backend/tests/.
      - name: Backend — install deps, import sanity-check, and run tests
        working-directory: backend
        env:
          SQUARE_ACCESS_TOKEN: ci-dummy-token
          SQUARE_LOCATION_ID: ci-dummy-location
        run: |
          pip install -r requirements-dev.txt
          python -m compileall app
          python -c "from app.main import app"
          pytest

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend typecheck + production build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}        # optional, defaults to 22
          APP_DIR: ${{ secrets.VPS_APP_DIR }}  # optional, defaults to ~/salonLandings
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${PORT:-22}" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -p "${PORT:-22}" "$USER@$HOST" bash -se <<EOF
            set -euo pipefail
            cd "${APP_DIR:-\$HOME/salonLandings}"
            git fetch origin main
            # Match main exactly; the gitignored .env (secrets) is untouched.
            git reset --hard origin/main
            # Static deploy: the containers are retired (salonLandings decommission), host nginx
            # serves the built SPA and /api goes to salaryReview. See scripts/deploy-static.sh.
            ./scripts/deploy-static.sh
          EOF
