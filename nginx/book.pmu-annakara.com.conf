# Nginx reverse-proxy config for book.pmu-annakara.com (AK PMU booking landing page).
#
# This is a snapshot of the LIVE config at /etc/nginx/sites-available/book.pmu-annakara.com on
# the VPS (kept here for version control / disaster recovery, checked in 2026-09-09 — no prior
# checked-in copy existed before that). Already has SSL provisioned via Certbot.
#
# To restore from scratch on a fresh box:
#   sudo cp nginx/book.pmu-annakara.com.conf /etc/nginx/sites-available/book.pmu-annakara.com
#   sudo ln -s /etc/nginx/sites-available/book.pmu-annakara.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d book.pmu-annakara.com
#
# Temporarily points at the SAME mani_frontend/backend containers as mani.akluxnails.com — the
# app is already multi-tenant (business resolved by Host header, see salonLandings'
# docs/multi-tenant-akpmu-design.md), so this domain already resolves to business 2 (AK PMU) and
# its own real Square connection end-to-end. Content/branding still says AK.LUX.NAILS/mani until
# that gets swapped for real PMU copy/images/booking flow — known, deliberate, temporary.
upstream pmu_frontend {
    server 127.0.0.1:3001 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:3003 max_fails=1 fail_timeout=3s;
}

server {
    server_name book.pmu-annakara.com;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=15768000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 2026-09-09: pmu-annakara.com (this business's own WordPress site, a different origin)
    # embeds this booking flow in an iframe-based popup for its PMU-content pages — plain
    # SAMEORIGIN above would silently block that entirely. CSP's frame-ancestors takes precedence
    # over X-Frame-Options in any browser that understands it (the spec has browsers ignore
    # X-Frame-Options once frame-ancestors is present), so this scopes the allowance to exactly
    # that one external site rather than dropping framing protection altogether; XFO above stays
    # as the fallback for the rare browser with no CSP support at all. Same change applied to
    # mani.akluxnails.com (see salonLandings/nginx/mani.akluxnails.com.conf) for the same reason.
    add_header Content-Security-Policy "frame-ancestors 'self' https://pmu-annakara.com https://www.pmu-annakara.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # This domain is a paid-traffic-only conversion page (ad landers via ?v=<variant>, see
    # lib/experiments.ts) — pmu-annakara.com (the WordPress marketing site) already owns organic
    # SEO for these same topics ("permanent eyebrows san diego" etc.). Without this, Google could
    # index this domain too and end up ranking it against pmu-annakara.com's own dedicated pages
    # for the same keywords (found live 2026-08-26: no robots.txt, no noindex meta existed here at
    # all). A real robots.txt is the primary signal (keeps crawl budget off this domain
    # entirely); the noindex meta tags below are defense-in-depth for a page Google already has
    # indexed from before this was added.
    location = /robots.txt {
        add_header Content-Type text/plain always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Root document only: rewrite the static AK.LUX.NAILS <title>/meta/OG tags to PMU's own
    # branding server-side, inject noindex (see the robots.txt location above for why), and inject
    # real static fallback content into the empty <div id="root"> the SPA ships with.
    #
    # This whole app is client-rendered (see frontend/src/main.tsx's createRoot().render() — no
    # SSR, no hydration, so replacing the div's children server-side is safe: a real browser's
    # React mount fully replaces them again on load, same as it always did). Twilio's toll-free
    # business_website verification reads raw HTML without executing JS (same "doesn't run JS"
    # behavior already proven for the social link-preview crawlers above and for
    # privacy_policy_url/terms_and_conditions_url — see their own location block's doc), so before
    # this the ENTIRE page — the primary business_website URL — had zero visible content for it to
    # check the business's name/address against, which is a very plausible read on rejection 30445
    # ("Business Information Could Not Be Verified..."). akluxnails.com (the URL used for the
    # already-approved mani/akluxnails toll-free number) is a real server-rendered Next.js site, so
    # it never had this gap — this closes the same gap here without a framework change.
    #
    # Social link-preview crawlers (Facebook/WhatsApp/Telegram/iMessage) never execute the
    # client-side JS that patches these tags at runtime (see
    # frontend/src/features/pmu/PmuLandingPage.tsx), so without this the messenger share card kept
    # showing AK.LUX.NAILS' logo/title/description. sub_filter can't rewrite a gzip-compressed
    # body, so Accept-Encoding is blanked for just this exact-match location.
    location = / {
        if ($blocked_ua) { return 403; }
        if ($blocked_ip) { return 403; }

        proxy_pass http://pmu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        sub_filter_once off;
        sub_filter "<title>Russian Hard Gel Manicure in Downtown San Diego | AK.LUX.NAILS</title>" "<title>Permanent Brows in San Diego | Anna Kara's Beauty PMU Studio</title>";
        sub_filter "content=\"Russian Hard Gel Manicure in Downtown San Diego | AK.LUX.NAILS\"" "content=\"Permanent Brows in San Diego | Anna Kara's Beauty PMU Studio\"";
        sub_filter "content=\"First-visit special: Russian Hard Gel Manicure in Downtown San Diego. No acrylics. Book your appointment online in under 60 seconds.\"" "content=\"Hand-drawn, realistic brow techniques by Anna Kara's team in San Diego. Start with a free online consultation — no cost, no commitment.\"";
        sub_filter "content=\"https://mani.akluxnails.com/\"" "content=\"https://book.pmu-annakara.com/\"";
        sub_filter "content=\"AK.LUX.NAILS\"" "content=\"Anna Kara's Beauty PMU Studio\"";
        sub_filter "content=\"https://mani.akluxnails.com/og-image.png\"" "content=\"https://book.pmu-annakara.com/pmu-og-image.png\"";
        sub_filter "<head>" "<head>
    <meta name=\"robots\" content=\"noindex, nofollow\" />";
        sub_filter "<div id=\"root\"></div>" "<div id=\"root\"><div style=\"max-width:600px;margin:0 auto;padding:48px 22px;font-family:system-ui,-apple-system,sans-serif;color:#2a211d;background:#fbf6f2;\"><h1 style=\"font-size:26px;margin:0 0 10px;\">Anna Kara's Beauty PMU Studio</h1><p style=\"margin:0 0 16px;color:#4a3d36;line-height:1.5;\">Permanent makeup studio in San Diego, CA, operated by Anna Kara's Brow Studio LLC &mdash; hand-drawn, realistic brow techniques and permanent makeup services. Start with a free consultation.</p><address style=\"font-style:normal;color:#4a3d36;\">1357 Seventh Ave, Ste C, San Diego, CA 92101</address></div></div>";
    }

    # /privacy-policy and /terms are static files shared with mani.akluxnails.com/akluxnails-home
    # (see salonLandings/frontend/public/{privacy-policy,terms}/index.html) — they re-brand for
    # this domain via a client-side <script> hostname check, but that only patches the DOM after a
    # real browser loads and runs it. Twilio's toll-free URL verification (like the social
    # link-preview crawlers the root-page sub_filter above already works around) reads the raw
    # HTML without executing JS, so it was seeing "AK.LUX.NAILS" as the business name with no
    # contact email at all — a mismatch against the submitted business_name "Anna Kara's Brow
    # Studio LLC" that produced rejection 30445 ("...Contact, Email, Address, or URL Is Invalid").
    # Rewriting server-side here, the same way the root page's OG tags already are, means the raw
    # HTML is correct with no JS required. sub_filter can't rewrite a gzip-compressed body, so
    # Accept-Encoding is blanked for just this location, same as the root one.
    # (These two pages already carry their own <meta name="robots" content="noindex"> in the
    # static HTML itself, so no sub_filter injection needed here for that.)
    location ~ ^/(privacy-policy|terms)/?$ {
        if ($blocked_ua) { return 403; }
        if ($blocked_ip) { return 403; }

        proxy_pass http://pmu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        sub_filter_once off;
        sub_filter ">AK.LUX.NAILS<" ">Anna Kara's Brow Studio LLC<";
        sub_filter "<div id=\"business-email-row\" style=\"display: none; margin-top: 4px;\">
            <a id=\"business-email\" href=\"#\"></a>
          </div>" "<div id=\"business-email-row\" style=\"margin-top: 4px;\">
            <a id=\"business-email\" href=\"mailto:anna@pmu-annakara.com\">anna@pmu-annakara.com</a>
          </div>";
    }

    # Everything else (all client-side SPA routes, e.g. ?v=<variant> deep links on the root path
    # itself fall under location = / above; this covers any other path the SPA's router handles)
    # — also noindexed, same reasoning as the root location above.
    location / {
        if ($blocked_ua) { return 403; }
        if ($blocked_ip) { return 403; }

        proxy_pass http://pmu_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        sub_filter_once off;
        sub_filter "<head>" "<head>
    <meta name=\"robots\" content=\"noindex, nofollow\" />";
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/book.pmu-annakara.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/book.pmu-annakara.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = book.pmu-annakara.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name book.pmu-annakara.com;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
